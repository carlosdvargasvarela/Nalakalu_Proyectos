# ponytail: covers only the ActiveRecord/ActiveModel error keys, attribute
# names, and strftime (%b) tokens this app actually triggers today. A new
# model with an untranslated validator, or a new l(..., format:) using an
# untranslated strftime token, will show English/a translation-missing
# string until a key is added here — accepted gap, not exhaustive coverage
# (no rails-i18n / devise-i18n dependency added just for that).
es:
  date:
    abbr_month_names:
      -
      - ene
      - feb
      - mar
      - abr
      - may
      - jun
      - jul
      - ago
      - sep
      - oct
      - nov
      - dic
    formats:
      long: "%d %b %Y"
  time:
    formats:
      short: "%d %b %H:%M"
  helpers:
    submit:
      create: "Crear %{model}"
      update: "Actualizar %{model}"
      submit: "Guardar %{model}"
  activerecord:
    models:
      user: "usuario"
      project_type: "Tipo de proyecto"
      field_definition: "Campo"
      stage_template: "Subproceso"
      responsible_type: "Tipo de responsable"
      responsible: "Responsable"
      project_responsible: "Responsable de proyecto"
      project_type_association: "Tipo de asociación"
      project_association: "Asociación de proyecto"
      project: "Proyecto"
    attributes:
      user:
        email: "Correo electrónico"
        password: "Contraseña"
        password_confirmation: "Confirmación de contraseña"
      project_type:
        name: "Nombre"
        slug: "Slug"
      field_definition:
        key: "Clave"
        label: "Etiqueta"
        data_type: "Tipo de dato"
        reference_table: "Tabla de referencia"
        position: "Posición"
        show_in_gantt: "Mostrar en Gantt"
      stage_template:
        name: "Nombre"
        color: "Color"
        position: "Posición"
      project:
        name: "Nombre"
        status: "Estado"
      project_stage:
        name: "Nombre"
        progress_percent: "Porcentaje de avance"
        start_date: "Fecha de inicio"
        end_date: "Fecha de fin"
      responsible_type:
        name: "Nombre"
      responsible:
        name: "Nombre"
        color: "Color"
      project_type_association:
        label: "Etiqueta"
        shared_field_mappings: "Campos compartidos"
      project_association:
        from_project: "Proyecto de origen"
        to_project: "Proyecto de destino"
  errors:
    messages:
      blank: "no puede estar en blanco"
      taken: "ya está en uso"
      invalid: "no es válido"
      required: "debe existir"
      too_short:
        one: "es demasiado corto (mínimo 1 carácter)"
        other: "es demasiado corto (mínimo %{count} caracteres)"
      confirmation: "no coincide con %{attribute}"
      inclusion: "no está incluido en la lista"
